name: Test release prefix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with release_prefix (expect failure at API level)
        id: action
        uses: .
        continue-on-error: true
        with:
          release_prefix: "myapp-"
          set_commits: skip
          finalize: "false"
          disable_telemetry: "true"
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: my-org
          SENTRY_PROJECT: my-project
      - name: Assert action ran with release_prefix input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the token is fake, not because inputs are invalid.
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action ran with release_prefix input (outcome=${{ steps.action.outcome }})"
