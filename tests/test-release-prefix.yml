name: Test release prefix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK: "1"
      SENTRY_ORG: test-org
      SENTRY_AUTH_TOKEN: fake-token-for-mock
      SENTRY_PROJECT: test-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          release: "2.0.0"
          release_prefix: "myapp@"
          finalize: "false"
          set_commits: "skip"
          disable_telemetry: "true"

      - name: Assert release output has prefix
        env:
          RELEASE_OUT: ${{ steps.action.outputs.release }}
        run: |
          echo "release output: $RELEASE_OUT"
          if [ "$RELEASE_OUT" != "myapp@2.0.0" ]; then
            echo "FAIL: expected release output 'myapp@2.0.0', got '$RELEASE_OUT'"
            exit 1
          fi
          echo "PASS"
