name: Test release_prefix input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_ORG: my-org
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_PROJECT: my-project
        with:
          release: 1.0.0
          release_prefix: "myapp@"
          finalize: false
          set_commits: skip
          disable_telemetry: true

      - name: Assert action ran (release_prefix input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the API call stage (fake token), not at input validation.
          # Either outcome (success or failure) means the inputs were accepted.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with release_prefix input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
