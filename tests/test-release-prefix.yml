name: Test release prefix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the release_prefix input is accepted by the action.
      # With fake credentials the action will fail at the API call stage,
      # not at input validation — confirming the input is recognized.
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release_prefix: "myapp@"
          set_commits: skip
          finalize: "false"
          disable_telemetry: "true"

      - name: Assert action ran with release_prefix input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with release_prefix input (outcome=$OUTCOME)"
