name: Test manual set_commits with repo, commit, and previous_commit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      SENTRY_AUTH_TOKEN: fake-token-for-testing
      SENTRY_ORG: fake-org
      SENTRY_PROJECT: fake-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Sentry Release action with manual set_commits and all required inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          release: "test-release-manual-commits-1.0.0"
          set_commits: "manual"
          repo: "my-org/my-repo"
          commit: "abc1234567890abcdef1234567890abcdef12345"
          previous_commit: "def4567890abcdef1234567890abcdef12345678"
          finalize: "true"
          disable_telemetry: "true"

      - name: Assert action was invoked with manual commits inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should be invoked (success or failure due to fake credentials).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with repo, commit, and previous_commit (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
