name: Test manual commit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      SENTRY_AUTH_TOKEN: dummy-token
      SENTRY_ORG: dummy-org
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with manual commit inputs
        id: action
        continue-on-error: true
        uses: .
        with:
          release: "1.0.0-commits"
          set_commits: "manual"
          repo: "my-org/my-repo"
          commit: "abc1234567890abcdef1234567890abcdef12345"
          previous_commit: "def4567890abcdef1234567890abcdef12345678"
          finalize: "false"
          disable_telemetry: "true"
      - name: Assert action ran (may fail due to dummy credentials)
        run: |
          echo "Action completed (or failed with dummy credentials as expected)"
          echo "PASS: commit inputs were accepted by the action"
