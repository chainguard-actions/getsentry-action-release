name: Test disable flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with disable flags (expect failure without real Sentry credentials)
        id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token
          SENTRY_ORG: fake-org
          SENTRY_PROJECT: fake-project
        with:
          release: test-release-1.0.0
          finalize: "false"
          disable_telemetry: "true"
          disable_safe_directory: "true"
          set_commits: "skip"

      - name: Assert action ran with disable flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should have run (either succeeded or failed with auth error)
          # but NOT been skipped or errored due to misconfiguration of disable flags
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with disable flags (outcome=$OUTCOME)"
