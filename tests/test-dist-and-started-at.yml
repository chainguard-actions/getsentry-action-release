name: Test dist and started_at inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts dist and started_at inputs without crashing
      # on input wiring. The action will fail at the Sentry API level with dummy credentials.
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release: test-release-dist-1.0.0
          dist: "42"
          started_at: "1700000000"
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"

      - name: Assert action ran with dist and started_at inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected with dist and started_at inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
