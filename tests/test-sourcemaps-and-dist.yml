name: Test sourcemaps, dist, url_prefix, working_directory, version, version_prefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake sourcemaps directory and file
        run: |
          mkdir -p /tmp/sourcemaps
          echo '{"version":3,"sources":["app.js"],"mappings":""}' > /tmp/sourcemaps/app.js.map

      - name: Run action with sourcemaps, dist, url_prefix, working_directory, version, version_prefix
        id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: my-org
          SENTRY_PROJECT: my-project
        with:
          version: "1.2.3"
          version_prefix: "myapp-"
          dist: "42"
          sourcemaps: "/tmp/sourcemaps"
          url_prefix: "~/static/js"
          working_directory: "."
          set_commits: skip
          finalize: "false"
          disable_telemetry: "true"
          projects: my-project

      - name: Assert action ran (failed at API level, not at input parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the token is fake, not because inputs are invalid.
          # Either failure or success is acceptable here — we just want to confirm
          # the action was invoked and processed inputs without crashing on input validation.
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action ran and processed inputs (outcome=${{ steps.action.outcome }})"
