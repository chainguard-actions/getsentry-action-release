name: Test version_prefix and working_directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working directory for the action
        run: |
          mkdir -p /tmp/my-app
          cd /tmp/my-app
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "console.log('hello');" > index.js
          git add .
          git commit -m "initial commit"

      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token
          SENTRY_ORG: dummy-org
          SENTRY_PROJECT: dummy-project
        with:
          version_prefix: "myapp@"
          working_directory: /tmp/my-app
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"

      - name: Assert action ran (failed due to invalid credentials, not setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with an API error (not a missing-input error)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with version_prefix/working_directory inputs and produced outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
