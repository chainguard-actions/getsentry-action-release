name: Test deprecated and prefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: dummy-token
      SENTRY_ORG: dummy-org
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with deprecated version inputs
        id: action
        continue-on-error: true
        uses: .
        with:
          version: "1.0.0-deprecated"
          version_prefix: "myapp@"
          release_prefix: "myapp@"
          started_at: "1700000000"
          disable_telemetry: "true"
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to dummy credentials)"
          echo "PASS: deprecated and prefix inputs were accepted and action was invoked"
