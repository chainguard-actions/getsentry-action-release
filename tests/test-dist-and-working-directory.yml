name: Test dist and working_directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a working directory for testing
        run: |
          mkdir -p /tmp/test-working-dir
      - name: Run action with dist and working_directory inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          release: "test-release-dist-1.0.0"
          dist: "42"
          working_directory: "/tmp/test-working-dir"
          set_commits: skip
          finalize: "false"
          disable_telemetry: "true"
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: my-org
          SENTRY_PROJECT: my-project
      - name: Assert action ran with dist and working_directory inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is fake, not because inputs are invalid.
          if [ "$OUTCOME" = "" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action ran with dist/working_directory inputs (outcome=$OUTCOME)"
