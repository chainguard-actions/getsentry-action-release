name: Test disable_safe_directory flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token
          SENTRY_ORG: dummy-org
          SENTRY_PROJECT: dummy-project
        with:
          release: test-release-safe-dir-1.0.0
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"
          disable_safe_directory: "true"

      - name: Assert action ran with disable_safe_directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with disable_safe_directory=true, outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
