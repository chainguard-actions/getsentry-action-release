name: Test environment input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the environment input is accepted by the action.
      # The environment input triggers adding a deploy to the release.
      # With fake credentials the action will fail at the API call stage,
      # not at input validation — confirming the input is recognized.
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release: test-release-env-1.0.0
          environment: production
          set_commits: skip
          finalize: "true"
          disable_telemetry: "true"

      - name: Assert action ran with environment input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with environment=production (outcome=$OUTCOME)"
