name: Test sourcemaps, url_prefix, and dist inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy sourcemap directory
        run: |
          mkdir -p /tmp/sourcemaps
          echo '{"version":3,"sources":["app.js"],"mappings":""}' > /tmp/sourcemaps/app.js.map

      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token
          SENTRY_ORG: dummy-org
          SENTRY_PROJECT: dummy-project
        with:
          release: test-release-sourcemaps-1.0.0
          sourcemaps: /tmp/sourcemaps
          url_prefix: "~/static/js"
          dist: "42"
          inject: "false"
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"

      - name: Assert action ran (failed due to invalid credentials, not setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with an API error (not a missing-input error)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with sourcemaps/url_prefix/dist inputs and produced outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
