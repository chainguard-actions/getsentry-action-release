name: Test sourcemaps, url_prefix, and working_directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake source map for testing
        run: |
          mkdir -p /tmp/sourcemaps
          echo '{"version":3,"sources":["app.js"],"mappings":""}' > /tmp/sourcemaps/app.js.map

      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token
          SENTRY_ORG: dummy-org
          SENTRY_PROJECT: dummy-project
        with:
          release: test-release-3.0.0
          sourcemaps: "/tmp/sourcemaps"
          url_prefix: "~/static/js"
          working_directory: "${{ github.workspace }}"
          inject: "false"
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"

      - name: Assert action ran with sourcemaps, url_prefix, working_directory inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with an API error (not a setup/input error)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
