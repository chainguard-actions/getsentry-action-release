name: Test auto release with prefix and projects (mock mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK: "true"
      SENTRY_AUTH_TOKEN: mock-token
      SENTRY_ORG: mock-org
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          release_prefix: "myapp@"
          projects: "proj-a proj-b"
          set_commits: skip
          finalize: "false"
          disable_telemetry: "true"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
