name: Test dist, projects, started_at, and version_prefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token
          SENTRY_ORG: dummy-org
          SENTRY_PROJECT: dummy-project
        with:
          release: test-release-2.0.0
          dist: "42"
          projects: "my-project another-project"
          started_at: "1700000000"
          version_prefix: "myapp@"
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"

      - name: Assert action ran with dist, projects, started_at, version_prefix inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with an API error (not a setup/input error)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
