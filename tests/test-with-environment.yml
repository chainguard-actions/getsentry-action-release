name: Test with environment deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK: "1"
      SENTRY_ORG: test-org
      SENTRY_AUTH_TOKEN: fake-token-for-mock
      SENTRY_PROJECT: test-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          release: "3.0.0-staging"
          environment: "staging"
          finalize: "true"
          set_commits: "skip"
          disable_telemetry: "true"

      - name: Assert release output with environment
        env:
          RELEASE_OUT: ${{ steps.action.outputs.release }}
        run: |
          echo "release output: $RELEASE_OUT"
          if [ "$RELEASE_OUT" != "3.0.0-staging" ]; then
            echo "FAIL: expected release output '3.0.0-staging', got '$RELEASE_OUT'"
            exit 1
          fi
          echo "PASS: action succeeded with environment input"
