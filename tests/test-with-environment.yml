name: Test with environment and finalize false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Sentry Release action with environment and finalize=false
        id: action
        uses: .
        continue-on-error: true
        with:
          release: test-release-2.0.0
          environment: staging
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"
        env:
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
          # No SENTRY_AUTH_TOKEN — action should fail gracefully

      - name: Assert action failed gracefully (no valid Sentry credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no auth token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
