name: Test invalid started_at fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK: "true"
      SENTRY_AUTH_TOKEN: mock-token
      SENTRY_ORG: mock-org
      SENTRY_PROJECT: mock-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release: v1.0.0
          environment: production
          started_at: "not-a-date"
          set_commits: skip
          disable_telemetry: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid started_at"
            exit 1
          fi
          echo "PASS"
