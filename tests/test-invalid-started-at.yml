name: Test invalid started_at format error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_ORG: my-org
      SENTRY_AUTH_TOKEN: fake-token-for-test
      MOCK: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid started_at value (expect failure)
        id: action
        uses: .
        with:
          release: test-release-1.0.0
          projects: my-project
          finalize: "false"
          set_commits: skip
          started_at: "not-a-valid-timestamp"
          disable_telemetry: "true"
        continue-on-error: true

      - name: Assert action failed with invalid started_at error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when started_at has invalid format"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid started_at format"
