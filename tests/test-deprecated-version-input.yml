name: Test deprecated version input backward compatibility
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK: "1"
      SENTRY_ORG: test-org
      SENTRY_AUTH_TOKEN: fake-token-for-mock
      SENTRY_PROJECT: test-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: "4.0.0-legacy"
          finalize: "false"
          set_commits: "skip"
          disable_telemetry: "true"

      - name: Assert release output uses deprecated version input
        env:
          RELEASE_OUT: ${{ steps.action.outputs.release }}
          VERSION_OUT: ${{ steps.action.outputs.version }}
        run: |
          echo "release output: $RELEASE_OUT"
          echo "version output: $VERSION_OUT"
          if [ "$RELEASE_OUT" != "4.0.0-legacy" ]; then
            echo "FAIL: expected release output '4.0.0-legacy', got '$RELEASE_OUT'"
            exit 1
          fi
          if [ "$VERSION_OUT" != "4.0.0-legacy" ]; then
            echo "FAIL: expected version output '4.0.0-legacy', got '$VERSION_OUT'"
            exit 1
          fi
          echo "PASS: deprecated version input works correctly"
