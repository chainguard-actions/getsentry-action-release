name: Test manual set_commits missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_ORG: my-org
      SENTRY_AUTH_TOKEN: fake-token-for-test
      MOCK: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with set_commits=manual but missing repo and commit (expect failure)
        id: action
        uses: .
        with:
          release: test-release-1.0.0
          projects: my-project
          finalize: "false"
          set_commits: manual
          # repo and commit intentionally omitted
          disable_telemetry: "true"
        continue-on-error: true

      - name: Assert action failed due to missing repo and commit
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when set_commits=manual but repo and commit are missing"
            exit 1
          fi
          echo "PASS: action correctly failed when set_commits=manual without repo and commit"
