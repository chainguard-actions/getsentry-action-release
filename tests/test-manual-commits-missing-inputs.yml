name: Test manual set_commits without required repo and commit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with set_commits=manual but missing repo/commit (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_ORG: my-org
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_PROJECT: my-project
        with:
          release: test-release-1.0.0
          finalize: "false"
          set_commits: manual
          # repo and commit intentionally omitted
          disable_telemetry: "true"

      - name: Assert action failed due to missing repo and commit for manual set_commits
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when set_commits=manual without repo/commit, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when set_commits=manual without required repo/commit inputs"
