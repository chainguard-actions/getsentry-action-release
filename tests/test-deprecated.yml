name: Test deprecated and prefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      SENTRY_AUTH_TOKEN: dummy-token
      SENTRY_ORG: dummy-org
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with deprecated version and prefix inputs
        id: action
        continue-on-error: true
        uses: .
        with:
          version: "2.0.0"
          version_prefix: "legacy-"
          release_prefix: "release-"
          ignore_missing: "true"
          ignore_empty: "true"
          disable_telemetry: "true"
      - name: Assert action ran (may fail due to dummy credentials)
        run: |
          echo "Action completed (or failed with dummy credentials as expected)"
          echo "PASS: deprecated and prefix inputs were accepted by the action"
