name: Test basic release inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify action files exist
        run: |
          if [ ! -f "actions/hardened/getsentry--action-release/v3.7.0/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-input-coverage
          SENTRY_ORG: fake-org
        with:
          release: "1.0.0"
          environment: production
          projects: my-project
          dist: "42"
          started_at: "1609459200"
          set_commits: skip
          finalize: true
          disable_telemetry: true
          disable_safe_directory: false
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to missing real Sentry credentials)"
          echo "PASS: inputs were passed to action"
