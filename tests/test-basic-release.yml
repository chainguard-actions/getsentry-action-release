name: Test basic release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: fake-token-for-testing
      SENTRY_ORG: fake-org
      SENTRY_PROJECT: fake-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release: "1.0.0-test"
          projects: "fake-project"
          environment: "production"
          finalize: "true"
          disable_telemetry: "true"
      - name: Assert action ran (may fail without real credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
