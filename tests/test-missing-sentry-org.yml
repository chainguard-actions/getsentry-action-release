name: Test missing SENTRY_ORG error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Deliberately omit SENTRY_ORG to trigger the validation error
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_PROJECT: my-project
        with:
          release: test-release-1.0.0
          finalize: false
          set_commits: skip
          disable_telemetry: true

      - name: Assert action failed due to missing SENTRY_ORG
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SENTRY_ORG is missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when SENTRY_ORG was missing"
