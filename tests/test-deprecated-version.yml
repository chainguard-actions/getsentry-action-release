name: Test deprecated version and version_prefix inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the deprecated "version" and "version_prefix" inputs are still
      # accepted without crashing on input wiring. The action will fail at the
      # Sentry API level with dummy credentials.
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          version: "1.0.0"
          version_prefix: "myapp@"
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"

      - name: Assert action ran with deprecated version and version_prefix inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected with deprecated version/version_prefix inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
