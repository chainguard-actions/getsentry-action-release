name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          release: "1.0.0-test"
          set_commits: "skip"
          disable_telemetry: "true"

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SENTRY_ORG and SENTRY_AUTH_TOKEN are missing, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when credentials are missing"
