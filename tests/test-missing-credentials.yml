name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          release: test-release-1.0.0
          set_commits: skip
          finalize: "false"
          disable_telemetry: "true"
        env:
          SENTRY_AUTH_TOKEN: ""
          SENTRY_ORG: ""
          SENTRY_PROJECT: ""
      - name: Assert action failed due to missing credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when credentials are missing"
            exit 1
          fi
          echo "PASS: action correctly failed when credentials are missing"
