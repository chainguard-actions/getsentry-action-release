name: Test manual set_commits with repo, commit, and previous_commit inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release: test-release-manual-1.0.0
          set_commits: manual
          repo: test-owner/test-repo
          commit: abc1234567890abcdef1234567890abcdef12345
          previous_commit: def4567890abcdef1234567890abcdef12345678
          finalize: "true"
          disable_telemetry: "true"

      - name: Assert action ran (expected to fail at API level, not at input level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should fail at the Sentry API level (bad credentials),
          # not due to missing or misconfigured inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected with manual commit inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
