name: Test Sentry release manual commits inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-input-coverage
          SENTRY_ORG: fake-org
        with:
          version: "1.0.0"
          version_prefix: "myapp-"
          set_commits: manual
          repo: "my-org/my-repo"
          commit: "abc1234567890abcdef1234567890abcdef12345"
          previous_commit: "def4567890abcdef1234567890abcdef12345678"
          ignore_missing: true
          ignore_empty: true
          disable_telemetry: true
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to missing real Sentry credentials)"
          echo "PASS: manual commits inputs were accepted"
