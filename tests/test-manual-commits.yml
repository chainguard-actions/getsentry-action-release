name: Test manual commits with dist and started_at
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Sentry Release action with manual commit settings
        id: action
        uses: .
        continue-on-error: true
        with:
          release: test-release-manual-1.0.0
          set_commits: manual
          repo: test-org/test-repo
          commit: abc1234567890abcdef1234567890abcdef1234
          previous_commit: def4567890abcdef1234567890abcdef12345678
          dist: "42"
          started_at: "1700000000"
          finalize: "true"
          disable_telemetry: "true"
        env:
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
          # No SENTRY_AUTH_TOKEN — action should fail gracefully

      - name: Assert action failed gracefully (no valid Sentry credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no auth token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (token may have been injected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
