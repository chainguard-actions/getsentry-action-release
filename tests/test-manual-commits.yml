name: Test manual set_commits with repo, commit, and previous_commit inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts repo, commit, and previous_commit inputs
      # when set_commits is "manual". The action will fail at the Sentry API level
      # with dummy credentials, but input wiring should work correctly.
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release: test-release-manual-commits-1.0.0
          set_commits: manual
          repo: test-owner/test-repo
          commit: abc1234567890abcdef1234567890abcdef12345
          previous_commit: def4567890abcdef1234567890abcdef12345678
          finalize: "false"
          disable_telemetry: "true"

      - name: Assert action ran with manual commit inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected with repo/commit/previous_commit inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
