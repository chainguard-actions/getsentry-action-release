name: Test manual commits inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get commit SHAs for manual commits
        id: shas
        run: |
          CURRENT=$(git rev-parse HEAD)
          PREVIOUS=$(git rev-parse HEAD~1 2>/dev/null || echo "$CURRENT")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-test
          SENTRY_ORG: fake-org
          SENTRY_PROJECT: fake-project
        with:
          release: test-release-manual-commits-1.0.0
          set_commits: manual
          repo: ${{ github.repository }}
          commit: ${{ steps.shas.outputs.current }}
          previous_commit: ${{ steps.shas.outputs.previous }}
          finalize: false
          disable_telemetry: true
      - name: Assert action ran (manual commits inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid Sentry credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
