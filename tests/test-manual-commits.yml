name: Test manual commit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with manual commit inputs
        id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: fake-org
        with:
          version: "1.0.0"
          version_prefix: "prefix-"
          release: "prefix-1.0.0"
          release_prefix: "rel-"
          set_commits: "manual"
          repo: "my-org/my-repo"
          commit: "abc1234567890abcdef1234567890abcdef12345"
          previous_commit: "def1234567890abcdef1234567890abcdef12345"
          started_at: "1609459200"
          disable_telemetry: "true"
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to invalid credentials)"
          echo "PASS: manual commit inputs were accepted by the action"
