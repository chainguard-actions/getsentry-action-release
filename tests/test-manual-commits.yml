name: Test manual commits inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: fake-token-for-testing
      SENTRY_ORG: fake-org
      SENTRY_PROJECT: fake-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "1.0.0-legacy"
          version_prefix: "prefix-"
          release: "1.0.0-manual-commits"
          release_prefix: "rel-"
          set_commits: "manual"
          repo: "fake-owner/fake-repo"
          commit: "abc1234567890abcdef1234567890abcdef12345"
          previous_commit: "def4567890abcdef1234567890abcdef12345678"
          started_at: "1700000000"
          ignore_missing: "true"
          ignore_empty: "true"
          disable_telemetry: "true"
      - name: Assert action ran (may fail without real credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
