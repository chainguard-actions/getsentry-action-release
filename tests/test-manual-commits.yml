name: Test Sentry release manual commits inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: dummy-token
      SENTRY_ORG: dummy-org
      SENTRY_PROJECT: dummy-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          version: "1.0.0-legacy"
          version_prefix: "legacy@"
          set_commits: "manual"
          repo: "my-org/my-repo"
          commit: "abc1234567890abcdef1234567890abcdef12345"
          previous_commit: "def4567890abcdef1234567890abcdef12345678"
          started_at: "1609459200"
          ignore_missing: "true"
          ignore_empty: "true"
          disable_telemetry: "true"
      - name: Assert action was attempted
        run: |
          echo "Action completed (may have failed due to invalid Sentry credentials, which is expected in test)"
          echo "PASS: manual-commits-related inputs were accepted"
