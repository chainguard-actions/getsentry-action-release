name: Test manual commit setting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with manual commit inputs
        id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: fake-org
        with:
          set_commits: manual
          repo: my-org/my-repo
          commit: abc1234567890abcdef1234567890abcdef12345
          previous_commit: def4567890abcdef1234567890abcdef12345678
          release: test-release-manual-1.0.0
          disable_telemetry: "true"
      - name: Assert action ran (credentials will fail but inputs are accepted)
        run: |
          echo "Action completed with continue-on-error (expected to fail without real credentials)"
          echo "PASS: manual commit inputs were accepted"
