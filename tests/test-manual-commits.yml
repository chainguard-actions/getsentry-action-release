name: Test manual commits inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token
          SENTRY_ORG: fake-org
        with:
          release: "2.0.0"
          set_commits: manual
          repo: my-org/my-repo
          commit: "abc1234567890abcdef1234567890abcdef12345"
          previous_commit: "def4567890abcdef1234567890abcdef12345678"
          started_at: "1700000000"
          disable_telemetry: true
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action completed (with or without error - credentials are fake)"
          echo "PASS: manual commits inputs were accepted"
