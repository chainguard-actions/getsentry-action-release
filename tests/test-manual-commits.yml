name: Test Sentry Release - Manual Commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: fake-token-for-testing
      SENTRY_ORG: fake-org
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Sentry Release action with manual commit inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          release: "test-release-1.0.0"
          environment: "production"
          dist: "42"
          projects: "my-project"
          set_commits: "manual"
          repo: "my-org/my-repo"
          commit: "abc1234567890abcdef1234567890abcdef123456"
          previous_commit: "def1234567890abcdef1234567890abcdef123456"
          started_at: "1609459200"
          finalize: "false"
          disable_telemetry: "true"

      - name: Assert action was invoked (inputs accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real Sentry credentials,
          # but it should not fail due to input validation issues.
          # We accept both success and failure outcomes here.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with all manual-commit inputs"
