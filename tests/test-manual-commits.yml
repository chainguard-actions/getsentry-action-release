name: Test manual commits inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: fake-token-for-testing
      SENTRY_ORG: fake-org
      SENTRY_PROJECT: fake-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "1.0.0-legacy"
          version_prefix: "legacy-"
          set_commits: "manual"
          repo: "fake-owner/fake-repo"
          commit: "abc1234567890abcdef1234567890abcdef12345"
          previous_commit: "def4567890abcdef1234567890abcdef12345678"
          finalize: "false"
          disable_telemetry: "true"
          disable_safe_directory: "false"

      - name: Assert action ran (pass or expected failure)
        run: |
          echo "Action completed (may have failed due to fake credentials, which is expected)"
          echo "PASS"
