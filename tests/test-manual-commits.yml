name: Test manual commits and deprecated version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get current commit SHA
        id: git_info
        run: |
          CURRENT=$(git rev-parse HEAD)
          PARENT=$(git rev-parse HEAD~1 2>/dev/null || echo "$CURRENT")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "parent=$PARENT" >> $GITHUB_OUTPUT
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-input-coverage
          SENTRY_ORG: fake-org
        with:
          version: "legacy-1.0.0"
          version_prefix: "prefix-"
          release_prefix: "rel-"
          set_commits: manual
          repo: "my-org/my-repo"
          commit: ${{ steps.git_info.outputs.current }}
          previous_commit: ${{ steps.git_info.outputs.parent }}
          ignore_missing: true
          ignore_empty: true
          disable_telemetry: true
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to missing real Sentry credentials)"
          echo "PASS: manual commits inputs were passed to action"
