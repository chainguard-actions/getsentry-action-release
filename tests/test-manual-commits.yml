name: Test manual commits inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Sentry Release action with manual commit inputs (expect failure without credentials)
        id: action
        continue-on-error: true
        uses: .
        env:
          SENTRY_AUTH_TOKEN: fake-token
          SENTRY_ORG: fake-org
        with:
          version: "1.0.0"
          version_prefix: "prefix-"
          release_prefix: "rel-"
          set_commits: "manual"
          repo: "my-org/my-repo"
          commit: "abc1234567890abcdef1234567890abcdef12345"
          previous_commit: "def4567890abcdef1234567890abcdef12345678"
          started_at: "1609459200"
          ignore_missing: "true"
          ignore_empty: "true"
          disable_telemetry: "true"
      - name: Assert action ran (may fail without real credentials)
        run: |
          echo "Action completed (with or without error due to missing credentials)"
          echo "PASS"
