name: Test sourcemaps inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake sourcemaps directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          echo '{"version":3,"sources":["app.js"],"mappings":""}' > "$GITHUB_WORKSPACE/dist/app.js.map"
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-test
          SENTRY_ORG: fake-org
          SENTRY_PROJECT: fake-project
        with:
          release: test-release-sourcemaps-1.0.0
          sourcemaps: ./dist
          url_prefix: "~/dist"
          dist: "1"
          working_directory: ${{ github.workspace }}
          finalize: false
          disable_telemetry: true
      - name: Assert action ran (sourcemaps inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid Sentry credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
