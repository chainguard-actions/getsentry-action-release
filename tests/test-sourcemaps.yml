name: Test Sentry release sourcemaps inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with sourcemaps inputs
        id: action
        continue-on-error: true
        uses: .
        with:
          release: "test-release-sourcemaps-1.0.0"
          release_prefix: "myapp-"
          sourcemaps: "./dist"
          inject: "false"
          dist: "42"
          url_prefix: "~/dist"
          strip_common_prefix: "true"
          working_directory: "."
          disable_telemetry: "true"
        env:
          SENTRY_AUTH_TOKEN: "fake-token-for-testing"
          SENTRY_ORG: "fake-org"
          SENTRY_PROJECT: "my-project"
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed (may have failed due to invalid Sentry credentials, which is expected)"
          echo "PASS: sourcemaps inputs were accepted by the action"
