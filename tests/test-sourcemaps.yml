name: Test sourcemaps, dist, and url_prefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      SENTRY_AUTH_TOKEN: fake-token-for-testing
      SENTRY_ORG: fake-org
      SENTRY_PROJECT: fake-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake source map file for testing
        run: |
          mkdir -p /tmp/dist/js
          echo '{"version":3,"sources":["app.js"],"mappings":""}' > /tmp/dist/js/app.js.map

      - name: Run Sentry Release action with sourcemaps, dist, and url_prefix inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          release: test-release-sourcemaps-1.0.0
          sourcemaps: /tmp/dist/js
          dist: "42"
          url_prefix: "~/dist/js"
          inject: "false"
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"

      - name: Assert action was invoked with sourcemaps/dist/url_prefix inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with sourcemaps/dist/url_prefix inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
