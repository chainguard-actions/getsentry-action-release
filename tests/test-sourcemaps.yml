name: Test sourcemaps inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake sourcemap directory
        run: mkdir -p /tmp/sourcemaps
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token
          SENTRY_ORG: fake-org
        with:
          release: "1.0.0"
          sourcemaps: /tmp/sourcemaps
          inject: true
          dist: "42"
          url_prefix: "~/static/js"
          strip_common_prefix: false
          working_directory: "."
          disable_telemetry: true
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action completed (with or without error - credentials are fake)"
          echo "PASS: sourcemap inputs were accepted"
