name: Test Sentry release sourcemaps inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-input-coverage
          SENTRY_ORG: fake-org
        with:
          release_prefix: "myapp@"
          sourcemaps: "./dist/js"
          inject: false
          url_prefix: "~/js"
          strip_common_prefix: true
          working_directory: "."
          disable_telemetry: true
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to missing real Sentry credentials)"
          echo "PASS: sourcemaps-related inputs were accepted"
