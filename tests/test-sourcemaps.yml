name: Test sourcemaps inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake sourcemap directory
        run: |
          mkdir -p /tmp/sourcemaps
          echo '{"version":3,"sources":["app.js"],"mappings":""}' > /tmp/sourcemaps/app.js.map
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: fake-org
          SENTRY_PROJECT: fake-project
        with:
          release: "1.0.0-sourcemaps-test"
          sourcemaps: "/tmp/sourcemaps"
          inject: "false"
          dist: "42"
          url_prefix: "~/static/js"
          strip_common_prefix: "true"
          working_directory: "."
          disable_telemetry: "true"
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed (credentials are fake so failure is expected)"
