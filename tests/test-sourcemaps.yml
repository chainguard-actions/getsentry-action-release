name: Test Sentry Release - Sourcemaps and Prefix Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: fake-token-for-testing
      SENTRY_ORG: fake-org
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working directory with dummy sourcemaps
        run: |
          mkdir -p /tmp/test-workdir/dist
          echo '{"version":3,"sources":["app.js"],"mappings":""}' > /tmp/test-workdir/dist/app.js.map
          echo 'console.log("hello");' > /tmp/test-workdir/dist/app.js

      - name: Run Sentry Release action with sourcemap and prefix inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          version: "1.0.0-legacy"
          version_prefix: "myapp@"
          release_prefix: "release-"
          sourcemaps: "/tmp/test-workdir/dist"
          url_prefix: "~/dist"
          working_directory: "/tmp/test-workdir"
          inject: "false"
          strip_common_prefix: "true"
          finalize: "false"
          disable_telemetry: "true"

      - name: Assert action was invoked (inputs accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real Sentry credentials,
          # but it should not fail due to input validation issues.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with sourcemap and prefix inputs"
