name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      SENTRY_AUTH_TOKEN: fake-token-for-testing
      SENTRY_ORG: fake-org
      SENTRY_PROJECT: fake-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working directory with a git repo for testing
        run: |
          mkdir -p /tmp/my-app
          cd /tmp/my-app
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "app" > README.md
          git add README.md
          git commit -m "Initial commit"

      - name: Run Sentry Release action with working_directory
        id: action
        uses: .
        continue-on-error: true
        with:
          release: "test-release-workdir-1.0.0"
          working_directory: "/tmp/my-app"
          finalize: "true"
          disable_telemetry: "true"
          set_commits: "skip"

      - name: Assert action was invoked with working_directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should be invoked (success or failure due to fake credentials).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with working_directory (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
