name: Test working_directory input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a subdirectory to use as the working directory for the action
      - name: Create working directory
        run: mkdir -p "$GITHUB_WORKSPACE/my-app-dist"

      # Test that the action accepts the working_directory input without crashing
      # on input wiring. The action will fail at the Sentry API level with dummy credentials.
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release: test-release-workdir-1.0.0
          working_directory: "./my-app-dist"
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"

      - name: Assert action ran with working_directory input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected with working_directory input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
