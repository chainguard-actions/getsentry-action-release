name: Test ignore_missing and ignore_empty flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that ignore_missing and ignore_empty inputs are accepted.
      # These flags control behavior when commits are not found or no new
      # commits exist for a release. With fake credentials the action will
      # fail at the API call stage, not at input validation.
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release: test-release-flags-1.0.0
          set_commits: auto
          ignore_missing: "true"
          ignore_empty: "true"
          finalize: "false"
          disable_telemetry: "true"

      - name: Assert action ran with ignore flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with ignore_missing=true ignore_empty=true (outcome=$OUTCOME)"
