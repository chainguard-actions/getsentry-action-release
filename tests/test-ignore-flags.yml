name: Test Sentry Release action with ignore_missing and ignore_empty flags
on:
  workflow_dispatch:
jobs:
  test-ignore-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts ignore_missing and ignore_empty flags
      # without crashing on input validation. The action will fail at the Sentry
      # API level since we use dummy credentials, which is expected.
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release: test-release-ignore-flags
          ignore_missing: "true"
          ignore_empty: "true"
          finalize: "true"
          disable_telemetry: "true"
          disable_safe_directory: "false"

      - name: Assert action ran with ignore flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ignore_missing=true and ignore_empty=true (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
