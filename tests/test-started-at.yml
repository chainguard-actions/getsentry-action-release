name: Test started_at and working_directory inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory
        run: mkdir -p /tmp/sentry-test-workdir

      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release: test-release-started-at-1.0.0
          started_at: "1700000000"
          working_directory: /tmp/sentry-test-workdir
          finalize: "true"
          disable_telemetry: "true"

      - name: Assert action ran (expected to fail at API level, not at input level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should fail at the Sentry API level (bad credentials),
          # not due to missing or misconfigured inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected with started_at and working_directory inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
