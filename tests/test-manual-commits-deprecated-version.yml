name: Test manual set_commits with deprecated version inputs (mock mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK: "true"
      SENTRY_AUTH_TOKEN: mock-token
      SENTRY_ORG: mock-org
      SENTRY_PROJECT: mock-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          version: 2.0.0
          version_prefix: myapp@
          set_commits: manual
          repo: example-org/example-repo
          commit: 1111111111111111111111111111111111111111
          previous_commit: 0000000000000000000000000000000000000000
          disable_telemetry: "true"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
