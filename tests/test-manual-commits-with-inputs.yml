name: Test manual set_commits with repo, commit, and previous_commit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get current and previous commit SHAs
        id: commits
        run: |
          CURRENT=$(git rev-parse HEAD)
          PREVIOUS=$(git rev-parse HEAD~1 2>/dev/null || echo "$CURRENT")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
      - name: Run action with set_commits=manual and repo/commit/previous_commit inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          release: "test-release-manual-commits-1.0.0"
          set_commits: manual
          repo: "my-org/my-repo"
          commit: ${{ steps.commits.outputs.current }}
          previous_commit: ${{ steps.commits.outputs.previous }}
          finalize: "false"
          disable_telemetry: "true"
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: my-org
          SENTRY_PROJECT: my-project
      - name: Assert action ran with manual commit inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is fake, not because inputs are invalid.
          if [ "$OUTCOME" = "" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action ran with set_commits=manual and repo/commit/previous_commit inputs (outcome=$OUTCOME)"
