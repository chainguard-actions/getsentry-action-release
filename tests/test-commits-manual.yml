name: Test manual commit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: dummy-token
      SENTRY_ORG: dummy-org
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with manual commit inputs
        id: action
        continue-on-error: true
        uses: .
        with:
          release: test-release-commits-1.0.0
          set_commits: manual
          repo: my-org/my-repo
          commit: abc1234567890abcdef1234567890abcdef12345
          previous_commit: def4567890abcdef1234567890abcdef12345678
          ignore_missing: "true"
          ignore_empty: "true"
          disable_telemetry: "true"
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to dummy credentials)"
          echo "PASS: manual commit inputs were accepted and action was invoked"
