name: Test basic Sentry release inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with basic inputs
        id: action
        continue-on-error: true
        uses: .
        with:
          release: "test-release-1.0.0"
          projects: "my-project"
          environment: "staging"
          finalize: "false"
          ignore_missing: "true"
          ignore_empty: "true"
          disable_telemetry: "true"
          disable_safe_directory: "false"
        env:
          SENTRY_AUTH_TOKEN: "fake-token-for-testing"
          SENTRY_ORG: "fake-org"
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed (may have failed due to invalid Sentry credentials, which is expected)"
          echo "PASS: inputs were accepted by the action"
