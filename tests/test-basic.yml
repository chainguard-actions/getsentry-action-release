name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: fake-org
          SENTRY_PROJECT: fake-project
        with:
          release: "1.0.0-test"
          environment: "production"
          projects: "fake-project"
          finalize: "true"
          disable_telemetry: "true"
          disable_safe_directory: "false"
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed (credentials are fake so failure is expected)"
