name: Test basic Sentry release inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: dummy-token
      SENTRY_ORG: dummy-org
      SENTRY_PROJECT: dummy-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          release: "1.0.0-test"
          environment: "production"
          projects: "my-project"
          finalize: "true"
          disable_telemetry: "true"
      - name: Assert action was attempted
        run: |
          echo "Action completed (may have failed due to invalid Sentry credentials, which is expected in test)"
          echo "PASS: inputs were accepted"
