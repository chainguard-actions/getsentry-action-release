name: Test basic usage - missing auth token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Sentry Release action without auth token
        id: action
        uses: .
        continue-on-error: true
        with:
          release: test-release-1.0.0
          set_commits: skip
          finalize: "true"
          disable_telemetry: "true"
        env:
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
          # No SENTRY_AUTH_TOKEN — action should fail gracefully

      - name: Assert action failed gracefully due to missing auth token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no auth token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (token may have been injected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
