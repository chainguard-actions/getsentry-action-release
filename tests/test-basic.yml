name: Test basic release inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assert inputs are accepted
        id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: fake-org
        with:
          release: "1.0.0"
          environment: "production"
          projects: "my-project"
          dist: "42"
          finalize: "true"
          disable_telemetry: "true"
          set_commits: "skip"
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to invalid credentials)"
          echo "PASS: inputs were accepted by the action"
