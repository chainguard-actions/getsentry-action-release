name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      # Fake Sentry credentials - action will fail at API call, not at structural level
      SENTRY_AUTH_TOKEN: fake-token-for-testing
      SENTRY_ORG: fake-org
      SENTRY_PROJECT: fake-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Sentry Release action (expected to fail with auth error)
        id: action
        uses: .
        continue-on-error: true
        with:
          release: test-release-1.0.0
          finalize: "true"
          disable_telemetry: "true"

      - name: Assert action was invoked (failed with expected error, not a missing-input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with an auth/API error.
          # If it fails with a structural/config error, that's unexpected.
          # We accept both 'success' and 'failure' here since we don't have real credentials.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
