name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token
          SENTRY_ORG: fake-org
        with:
          release: "1.0.0"
          environment: production
          projects: my-project
          finalize: true
          disable_telemetry: true
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action completed (with or without error - credentials are fake)"
          echo "PASS: inputs were accepted"
