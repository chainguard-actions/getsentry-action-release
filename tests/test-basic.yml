name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with basic inputs
        id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: fake-org
        with:
          environment: production
          release: test-release-1.0.0
          projects: my-project
          started_at: "1700000000"
          dist: "42"
          finalize: "true"
          disable_telemetry: "true"
      - name: Assert action ran (credentials will fail but inputs are accepted)
        run: |
          echo "Action completed with continue-on-error (expected to fail without real credentials)"
          echo "PASS: inputs were accepted"
