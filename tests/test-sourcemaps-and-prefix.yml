name: Test sourcemaps, url_prefix, version, version_prefix, and working_directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working directory with a fake sourcemap
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/js"
          echo '{"version":3,"sources":["app.js"],"mappings":""}' > "$GITHUB_WORKSPACE/dist/js/app.js.map"

      - name: Run Sentry Release action with sourcemaps and prefix options
        id: action
        uses: .
        continue-on-error: true
        with:
          version: "1.2.3"
          version_prefix: "myapp-"
          sourcemaps: dist/js
          url_prefix: "~/dist/js"
          inject: "false"
          set_commits: skip
          finalize: "true"
          working_directory: "${{ github.workspace }}"
          disable_telemetry: "true"
        env:
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
          # No SENTRY_AUTH_TOKEN — action should fail gracefully

      - name: Assert action failed gracefully (no valid Sentry credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no auth token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (token may have been injected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
