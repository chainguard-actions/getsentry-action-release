name: Test deprecated version inputs and ignore flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with deprecated version inputs
        id: action
        continue-on-error: true
        uses: .
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-testing
          SENTRY_ORG: fake-org
        with:
          version: "2.0.0-deprecated-test"
          version_prefix: "prefix-"
          release_prefix: "rel-"
          ignore_missing: "true"
          ignore_empty: "true"
          disable_telemetry: "true"
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked"
