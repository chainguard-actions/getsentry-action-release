name: Test Sentry Release action with set_commits=skip
on:
  workflow_dispatch:
jobs:
  test-set-commits-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts set_commits=skip without crashing on input
      # validation. The action will fail at the Sentry API level since we use
      # dummy credentials, which is expected.
      - id: action
        uses: .
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: dummy-token-for-testing
          SENTRY_ORG: test-org
          SENTRY_PROJECT: test-project
        with:
          release: test-release-skip-commits
          set_commits: skip
          finalize: "true"
          disable_telemetry: "true"
          disable_safe_directory: "false"

      - name: Assert action ran with set_commits=skip
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with set_commits=skip (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
