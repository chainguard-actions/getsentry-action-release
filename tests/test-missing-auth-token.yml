name: Test missing SENTRY_AUTH_TOKEN error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTRY_ORG: my-org
      # SENTRY_AUTH_TOKEN intentionally omitted to trigger validation error
      # MOCK intentionally omitted so validation is not bypassed
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without SENTRY_AUTH_TOKEN (expect failure)
        id: action
        uses: .
        with:
          release: test-release-1.0.0
          projects: my-project
          finalize: "false"
          set_commits: skip
          disable_telemetry: "true"
        continue-on-error: true

      - name: Assert action failed with missing SENTRY_AUTH_TOKEN error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when SENTRY_AUTH_TOKEN is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when SENTRY_AUTH_TOKEN is missing"
