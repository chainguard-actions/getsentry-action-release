name: Test missing SENTRY_AUTH_TOKEN error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Provide SENTRY_ORG but deliberately omit SENTRY_AUTH_TOKEN
          SENTRY_ORG: my-org
          SENTRY_PROJECT: my-project
        with:
          release: test-release-1.0.0
          finalize: false
          set_commits: skip
          disable_telemetry: true

      - name: Assert action failed due to missing SENTRY_AUTH_TOKEN
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SENTRY_AUTH_TOKEN is missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when SENTRY_AUTH_TOKEN was missing"
